name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build everything (including the MSIX) without creating a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: cargo test --workspace

      - name: Build CLI
        run: cargo build --release -p lowtide

      - name: Build desktop app
        working-directory: crates/gui
        run: |
          npm ci
          npx tauri build

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          Compress-Archive target/release/lowtide.exe "lowtide-cli-$v-windows-x64.zip"
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1) "Lowtide-$v-setup.exe"

      - name: Build MSIX
        shell: powershell
        env:
          # Set these repository variables to the values from Partner Center > Product identity.
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & ./crates/gui/msix/build-msix.ps1 -Exe target/release/lowtide-app.exe -Version $version -OutDir dist -TestSign

      # Store package (unsigned, upload to Partner Center) and a self-signed test package.
      # Kept as workflow artifacts, not release assets: neither is meant for end users.
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: |
            dist/*.msix
            dist/*.cer
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            lowtide-cli-*.zip
            Lowtide-*-setup.exe
