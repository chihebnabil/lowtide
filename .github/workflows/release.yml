name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: cargo test --workspace

      - name: Build CLI
        run: cargo build --release -p lowtide

      - name: Build desktop app
        working-directory: crates/gui
        run: |
          npm ci
          npx tauri build

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          Compress-Archive target/release/lowtide.exe "lowtide-cli-$v-windows-x64.zip"
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1) "Lowtide-$v-setup.exe"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            lowtide-cli-*.zip
            Lowtide-*-setup.exe
