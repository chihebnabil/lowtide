[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui"]
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/chihebnabil/lowtide"

[workspace.dependencies]
lowtide-core = { path = "crates/core" }
anyhow = "1.0.104"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
