<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lowtide</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand" data-tauri-drag-region>
        <svg class="logo" viewBox="0 0 1024 1024" aria-hidden="true">
          <defs>
            <linearGradient id="lg-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123139"/><stop offset="1" stop-color="#081619"/></linearGradient>
            <linearGradient id="lg-sea" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fd6b0"/><stop offset="1" stop-color="#3bb4ea"/></linearGradient>
            <clipPath id="lg-tile"><rect x="64" y="64" width="896" height="896" rx="220"/></clipPath>
          </defs>
          <g clip-path="url(#lg-tile)">
            <rect x="64" y="64" width="896" height="896" fill="url(#lg-sky)"/>
            <circle cx="512" cy="392" r="150" fill="#f1d39a"/>
            <path d="M64 560 C 200 520, 330 600, 512 560 S 820 520, 960 560" fill="none" stroke="#2fd6b0" stroke-opacity="0.35" stroke-width="34" stroke-linecap="round"/>
            <path d="M64 700 C 210 652, 340 744, 512 700 S 820 652, 960 700 L 960 960 L 64 960 Z" fill="url(#lg-sea)"/>
          </g>
        </svg>
        <span class="wordmark" data-tauri-drag-region>Lowtide</span>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-view="overview"><svg class="i"><use href="#i-waves"/></svg><span>Overview</span></button>
        <button class="nav-item" data-view="caches"><svg class="i"><use href="#i-layers"/></svg><span>Caches</span><span class="nav-count" id="nc-caches"></span></button>
        <button class="nav-item" data-view="projects"><svg class="i"><use href="#i-folder"/></svg><span>Projects</span><span class="nav-count" id="nc-projects"></span></button>
        <div class="nav-label">Coming in Pro</div>
        <button class="nav-item" data-view="vdisks"><svg class="i"><use href="#i-box"/></svg><span>Docker &amp; WSL</span><span class="pro-chip">PRO</span></button>
        <button class="nav-item" data-view="autopilot"><svg class="i"><use href="#i-clock"/></svg><span>Autopilot</span><span class="pro-chip">PRO</span></button>
      </nav>

      <div class="sidebar-foot">
        <div class="drive-mini" id="drive-mini" hidden>
          <div class="drive-mini-top"><span id="dm-label">Drive C:</span><span id="dm-free"></span></div>
          <div class="drive-mini-bar"><i id="dm-used"></i></div>
        </div>
        <button class="admin-line" id="admin-line"><svg class="i sm"><use href="#i-shield"/></svg><span id="admin-text">Standard mode</span></button>
        <div class="version" id="version"></div>
      </div>
    </aside>

    <main class="main">
      <div class="titlebar" data-tauri-drag-region>
        <div class="status" id="status" data-tauri-drag-region></div>
        <div class="winctl">
          <button id="wc-min" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
          <button id="wc-max" aria-label="Maximize"><svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9"/></svg></button>
          <button id="wc-close" class="close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
        </div>
      </div>
      <div class="page" id="page"></div>

      <div class="selbar" id="selbar" hidden>
        <span class="sel-info"><b id="sel-n">0</b> <span id="sel-noun">selected</span></span>
        <span class="sel-size" id="sel-size"></span>
        <button class="btn text" id="sel-clear">Clear</button>
        <button class="btn primary" id="sel-clean">Clean</button>
      </div>
    </main>
  </div>

  <dialog id="confirm">
    <form method="dialog">
      <div class="dlg-icon" id="dlg-icon"><svg class="i"><use href="#i-sparkle"/></svg></div>
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <ul id="confirm-list"></ul>
      <div class="dlg-actions">
        <button value="cancel" class="btn ghost">Cancel</button>
        <button value="ok" class="btn primary" id="confirm-ok">Clean</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <!-- Icon sprite: 24px grid, 1.75 stroke -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-waves" viewBox="0 0 24 24"><path d="M2 9.5c2.5-2.5 4.5-2.5 7 0s4.5 2.5 7 0 4.5-2.5 6-1M2 15.5c2.5-2.5 4.5-2.5 7 0s4.5 2.5 7 0 4.5-2.5 6-1"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></symbol>
      <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 7.5l-9-4.5-9 4.5v9l9 4.5 9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
      <symbol id="i-shield-check" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
      <symbol id="i-gamepad" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7.5 10.5v4M5.5 12.5h4M15.5 11.5h.01M17.5 13.5h.01"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11.5A8 8 0 0 0 5.6 7M4 3.5V8h4.5M4 12.5A8 8 0 0 0 18.4 17M20 20.5V16h-4.5"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
      <symbol id="i-recycle" viewBox="0 0 24 24"><path d="M7 19H4.5l2.8-4.8M17 19h2.5l-2.8-4.8M9.5 5.5L12 3l2.5 2.5M12 3v6M6 11l-2 3.5M18 11l2 3.5M8 19h8"/></symbol>
    </defs>
  </svg>

  <script src="app.js"></script>
</body>
</html>
