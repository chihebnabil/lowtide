<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a31"/>
      <stop offset="1" stop-color="#071417"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fd6b0"/>
      <stop offset="1" stop-color="#3bb4ea"/>
    </linearGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="220"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#sky)"/>
    <!-- the moon pulls the tide out -->
    <circle cx="512" cy="392" r="150" fill="#f1d39a"/>
    <!-- old high-water mark -->
    <path d="M64 560 C 200 520, 330 600, 512 560 S 820 520, 960 560" fill="none" stroke="#2fd6b0" stroke-opacity="0.35" stroke-width="34" stroke-linecap="round"/>
    <!-- the receded sea -->
    <path d="M64 700 C 210 652, 340 744, 512 700 S 820 652, 960 700 L 960 960 L 64 960 Z" fill="url(#sea)"/>
  </g>
</svg>
